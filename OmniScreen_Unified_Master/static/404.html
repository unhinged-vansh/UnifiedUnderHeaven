<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Liquidity Void | OmniScreen Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --card: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 6rem;
      font-weight: 800;
      color: var(--red);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .badge {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: 1px solid rgba(239, 68, 68, 0.3);
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.85rem; font-weight: 800; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
    p { color: var(--text-muted); max-width: 500px; font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; }
    .btn-group { display: flex; gap: 1rem; }
    a {
      text-decoration: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      transition: background 0.15s;
    }
    a:hover { background: var(--accent-hover); }
    .btn-alt { background: #1e293b; color: var(--text); border: 1px solid var(--border); }
    .btn-alt:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="code">404</div>
  <div class="badge">ORDER REJECTED • LIQUIDITY VOID</div>
  <h1>Asset or Route Not Found</h1>
  <p>The security ticker, page, or API route you requested does not exist in the active order book or has been delisted from the universe.</p>
  <div class="btn-group">
    <a href="/">Return to Screener Terminal</a>
    <a href="/docs" class="btn-alt">API Documentation</a>
  </div>
</body>
</html>
